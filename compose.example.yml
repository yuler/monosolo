# ===========================================================================
# Example Docker Compose file
# ===========================================================================

x-core-env:
  # `rails secret` or `openssl rand -hex 64` generate a random secret key
  &core_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-e84aa0d3f501eaeb64b6c4ddbb6ba2d27f25bf980b3f855e9b525dc80fd65fbdfdf46bdee5c0de6cf51642f332e030ef1afc17f0788af447a16cacb789b6e868}
  CORE_PORT: ${CORE_PORT:-3001}

services:
  core:
    image: ghcr.io/yuler/monosolo:main
    volumes:
      - core-storage:/rails/storage
    ports:
      - ${CORE_PORT:-3001}:3000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *core_env
    networks:
      - core_net

  worker:
    image: ghcr.io/yuler/monosolo:main
    command: bin/jobs
    volumes:
      - core-storage:/rails/storage
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *core_env
    networks:
      - core_net

  # apps/web — Vite SPA (static build served on port 80 in the container)
  web:
    image: ghcr.io/yuler/monosolo-web:main
    ports:
      - ${WEB_PORT:-3000}:80
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEB_PORT: ${WEB_PORT:-3000}
    depends_on:
      - core
    networks:
      - core_net

volumes:
  core-storage:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: ${PWD}/storage

networks:
  core_net:
    driver: bridge
