# ===========================================================================
# MonoSolo — Dokploy Compose (production, Mode B)
# ===========================================================================
#
# Dokploy → project → Compose service:
#   1. Provider: GitHub → yuler/monosolo → compose path: compose.dokploy.yml
#   2. Environment tab: paste `.env.dokploy.example` (fill secrets)
#   3. Registry: ghcr.io + a PAT with `read:packages` (images are private)
#   4. Domains: service `web`, container port 3000, HTTPS / Let's Encrypt
#   5. Deploy. Volume Backups: named volume `core-storage` (SQLite)
#
# Public traffic → Traefik → web:3000 → Nitro /api → http://core:80
# Core and worker stay off the public internet.
# ===========================================================================

x-core-env: &core_env
  SESSION_COOKIE_DOMAIN: ""
  SOLID_QUEUE_IN_PUMA: "false"
  SITE_DOMAIN: ${SITE_DOMAIN}

services:
  core:
    image: ghcr.io/yuler/monosolo:${IMAGE_TAG:-main}
    pull_policy: always
    env_file:
      - .env
    environment:
      <<: *core_env
    volumes:
      - core-storage:/rails/storage
    restart: unless-stopped
    networks:
      - default

  worker:
    image: ghcr.io/yuler/monosolo:${IMAGE_TAG:-main}
    pull_policy: always
    command: bin/jobs
    env_file:
      - .env
    environment:
      <<: *core_env
    volumes:
      - core-storage:/rails/storage
    depends_on:
      - core
    restart: unless-stopped
    networks:
      - default

  web:
    image: ghcr.io/yuler/monosolo-web:${IMAGE_TAG:-main}
    pull_policy: always
    environment:
      PORT: "3000"
      CORE_INTERNAL_URL: http://core:80
    expose:
      - "3000"
    depends_on:
      - core
    restart: unless-stopped
    networks:
      - default
      - dokploy-network

volumes:
  core-storage:

networks:
  dokploy-network:
    external: true
