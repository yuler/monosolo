name: PR Format Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-fix-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format-fix:
    runs-on: ubuntu-latest
    # Fork PRs cannot receive pushes from GITHUB_TOKEN on the contributor branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.319.0
        with:
          bundler-cache: true
          working-directory: core

      - name: Format fix (Biome + RuboCop)
        env:
          CI: "1"
          RUBOCOP_CACHE_ROOT: tmp/rubocop
        run: |
          set -euo pipefail
          pnpm --filter web format:fix
          (
            cd core
            bin/rubocop -A
          )

      - name: Commit and push fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No format changes to commit."
            exit 0
          fi
          git commit -m "💄 Apply format:fix"
          git push origin "HEAD:${{ github.head_ref }}"
